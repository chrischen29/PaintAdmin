<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者登入 | Helen Hu Artlist</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            font-family: 'Noto Sans TC', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
            border: none;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
            background: white;
        }
        .btn-login {
            border-radius: 8px;
            padding: 0.65rem;
            font-weight: 600;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            border: none;
            color: white;
        }
        .btn-login:hover {
            background: linear-gradient(135deg, #4338ca, #6d28d9);
            color: white;
        }
        .form-control {
            border-radius: 8px;
            padding: 0.75rem;
        }
        .form-control:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 0.2rem rgba(124,58,237,0.15);
        }
    </style>
</head>
<body>

    <div class="login-card text-center">
        <div class="mb-4">
            <span style="font-size:2.5rem;">🎨</span>
            <h4 class="fw-bold mt-2 mb-1">Helen Hu ARTLIST</h4>
            <p class="text-muted small">後台管理系統</p>
        </div>

        {% if error %}
        <div class="alert alert-danger py-2 small text-start">
            <i class="fas fa-exclamation-circle me-1"></i>{{ error }}
        </div>
        {% endif %}

        <form method="POST">
            <div class="mb-3 text-start">
                <label for="username" class="form-label small fw-bold text-secondary">使用者名稱</label>
                <input type="text" name="username" class="form-control" id="username"
                       placeholder="請輸入帳號" required autofocus>
            </div>
            <div class="mb-4 text-start">
                <label for="password" class="form-label small fw-bold text-secondary">密碼</label>
                <input type="password" name="password" class="form-control" id="password"
                       placeholder="請輸入密碼" required>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-login">
                    <i class="fas fa-sign-in-alt me-2"></i>登入
                </button>
            </div>
        </form>

        <div class="mt-4">
            <a href="https://paint-lzie.onrender.com" class="text-decoration-none small text-secondary">
                <i class="fas fa-arrow-left me-1"></i>返回藝廊首頁
            </a>
        </div>
    </div>

</body>
</html>
